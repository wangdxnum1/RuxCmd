[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.metadata.ruxcmd]
version = "0.1.0"
target = "x86_64-pc-windows-msvc"

[workspace.dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
thiserror = "1"
bitflags = "2"
once_cell = "1"
clap = { version = "4", features = ["derive"] }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_Console", "Win32_System_Kernel", "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop", "Win32_System_SystemInformation",
    "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
] }
