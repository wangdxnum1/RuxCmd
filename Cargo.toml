[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/wangdxnum1/RuxCmd"

[workspace.metadata.ruxcmd]
version = "0.4.0"
target = "x86_64-pc-windows-msvc"

[workspace.metadata.ruxcmd.windows]
productName = "RuxCmd"
companyName = "Tim and RuxCmd contributors"
copyright = "Copyright (c) 2026 Tim and RuxCmd contributors"

[workspace.dependencies]
ruxcmd-build = { path = "crates/ruxcmd-build" }
assert_cmd = "2"
predicates = "3"
tempfile = "3"
thiserror = "1"
bitflags = "2"
clap = { version = "4", features = ["derive"] }
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading",
    "Win32_System_Console", "Win32_System_Kernel", "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RemoteDesktop", "Win32_System_SystemInformation",
    "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem",
    "Win32_NetworkManagement_Dns",
] }
