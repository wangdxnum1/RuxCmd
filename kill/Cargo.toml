[package]
name = "kill"
version = "0.1.0"
edition = "2024"
description = "A Windows kill clone — send signal to processes, Linux-style"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Security"] }