name: Bug report
description: Report a reproducible command or infrastructure problem
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Windows version, terminal, suite/command version, or commit
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Command and input
      description: Exact command, arguments and minimal input; remove private data
      render: text
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include stdout, stderr and exit code when possible
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Additional verification
      description: GNU/Linux comparison or build/test output, if available
