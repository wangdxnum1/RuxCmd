name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          $version = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $version --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          # The key covers the toolchain, lockfile, cargo config and this workflow
          # file itself, so a stale target tree is never reused after any of them
          # changes. A miss simply rebuilds; `cache-workspace-crates: false` keeps
          # this run's crates out of the cache, so a hit can never substitute the
          # 142 release binaries that the compatibility check reads.
          key: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml', '.github/workflows/ci.yml') }}
          cache-targets: true
          cache-workspace-crates: false
      - name: Verify workspace and build release binaries
        run: ./scripts/build.ps1 -Task Verify
      - name: Confirm the release binaries were produced by this build
        run: ./scripts/verify-version-info.ps1
      - name: Check compatibility tables and documented counts
        run: ./scripts/compat-check.ps1
      - name: Build and verify ZIP
        run: ./scripts/release.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruxcmd-windows-x64-ci
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7
