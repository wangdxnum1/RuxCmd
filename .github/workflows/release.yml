name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing suite tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag input
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Expected a version tag such as v0.1.0.' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          $version = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $version --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-msvc-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}
      - name: Validate source
        run: ./scripts/build.ps1 -Task Verify
      - name: Build and verify tagged release
        run: ./scripts/release.ps1 -RequireClean -Tag $env:RELEASE_TAG
      - name: Install pinned Inno Setup
        run: |
          $toolchain = Get-Content -LiteralPath scripts/packaging/inno/toolchain.json -Raw | ConvertFrom-Json
          $version = [string]$toolchain.innoSetupVersion
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $installed = if (Test-Path -LiteralPath $iscc) { [Diagnostics.FileVersionInfo]::GetVersionInfo($iscc).ProductVersion } else { '' }
          if ($installed -notmatch "^$([regex]::Escape($version))") {
            $installer = Join-Path $env:RUNNER_TEMP "innosetup-$version.exe"
            Invoke-WebRequest -Uri $toolchain.downloadUrl -OutFile $installer
            $process = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Inno Setup installer exited $($process.ExitCode)." }
          }
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'ISCC.exe was not installed.' }
          $actual = [Diagnostics.FileVersionInfo]::GetVersionInfo($iscc).ProductVersion
          if ($actual -notmatch "^$([regex]::Escape($version))") { throw "Inno Setup version mismatch: expected $version, found '$actual'." }
          Write-Host "Inno Setup $actual at $iscc"
      - name: Build EXE installer
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $archive = @(Get-ChildItem -LiteralPath dist -Filter 'ruxcmd-*-x86_64-pc-windows-msvc.zip')[0]
          if (-not $archive) { throw 'Release ZIP not found in dist.' }
          ./scripts/package-installer.ps1 -Archive $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer step finished in $([Math]::Round($clock.Elapsed.TotalSeconds, 1))s."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruxcmd-${{ inputs.tag }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite." }
          $zips = @(Get-ChildItem dist/*.zip)
          $setups = @(Get-ChildItem dist/*.exe)
          if ($zips.Count -ne 1) { throw "Expected exactly one release ZIP, found $($zips.Count)." }
          if ($setups.Count -ne 1) { throw "Expected exactly one installer EXE, found $($setups.Count)." }
          foreach ($asset in @($zips + $setups)) {
            if (-not (Test-Path -LiteralPath "$($asset.FullName).sha256")) { throw "Missing checksum for $($asset.Name)." }
          }
          $paths = @($zips.FullName) + @($setups.FullName) + @(Get-ChildItem dist/*.sha256 | ForEach-Object FullName)
          $extra = @()
          if ($env:RELEASE_TAG -match '-') { $extra += '--prerelease' } else { $extra += '--latest' }
          gh release create $env:RELEASE_TAG @paths --repo $env:GITHUB_REPOSITORY --title "RuxCmd $($env:RELEASE_TAG)" --generate-notes @extra
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
