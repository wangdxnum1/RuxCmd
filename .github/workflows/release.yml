name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing suite tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Validate tag input
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Expected a version tag such as v0.1.0.' }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          $version = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "([^"]+)"').Matches[0].Groups[1].Value
          rustup toolchain install $version --profile minimal --component rustfmt --component clippy --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          # Match CI: keep dependencies, but rebuild workspace command artifacts.
          key: ${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml', '.github/workflows/ci.yml', '.github/workflows/release.yml') }}
          cache-targets: true
          cache-workspace-crates: false
      - name: Cache desktop build
        uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: desktop-${{ hashFiles('rust-toolchain.toml', 'desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock', 'desktop/src-tauri/build.rs', 'desktop/src-tauri/tauri.conf.json') }}
          cache-targets: true
          cache-workspace-crates: false
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/desktop-target
      - name: Validate source
        run: ./scripts/build.ps1 -Task Verify
      - name: Desktop checks
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/desktop-target
        run: |
          cargo fmt --manifest-path desktop/src-tauri/Cargo.toml --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and verify tagged release
        run: ./scripts/release.ps1 -RequireClean -Tag $env:RELEASE_TAG
      - name: Install supported Inno Setup
        run: ./scripts/packaging/inno/install-inno.ps1
      - name: Build EXE installer
        run: |
          $clock = [Diagnostics.Stopwatch]::StartNew()
          $archive = @(Get-ChildItem -LiteralPath dist -Filter 'ruxcmd-*-x86_64-pc-windows-msvc.zip')[0]
          if (-not $archive) { throw 'Release ZIP not found in dist.' }
          ./scripts/package-installer.ps1 -Archive $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Installer step finished in $([Math]::Round($clock.Elapsed.TotalSeconds, 1))s."
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ruxcmd-${{ inputs.tag }}-windows-x64
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:RELEASE_TAG already exists; refusing to overwrite." }
          $zips = @(Get-ChildItem dist/*.zip)
          $setups = @(Get-ChildItem dist/*.exe)
          if ($zips.Count -ne 1) { throw "Expected exactly one release ZIP, found $($zips.Count)." }
          if ($setups.Count -ne 1) { throw "Expected exactly one installer EXE, found $($setups.Count)." }
          foreach ($asset in @($zips + $setups)) {
            if (-not (Test-Path -LiteralPath "$($asset.FullName).sha256")) { throw "Missing checksum for $($asset.Name)." }
          }
          $paths = @($zips.FullName) + @($setups.FullName) + @(Get-ChildItem dist/*.sha256 | ForEach-Object FullName)
          $extra = @()
          if ($env:RELEASE_TAG -match '-') { $extra += '--prerelease' } else { $extra += '--latest' }
          # Release notes come from the matching CHANGELOG section; fall back
          # to generated notes when the version has no section.
          $version = $env:RELEASE_TAG.TrimStart('v')
          $notes = @()
          $inSection = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match '^## ') {
              if ($inSection) { break }
              if ($line -match ('^##\s+' + [regex]::Escape($version) + '\b')) { $inSection = $true }
            } elseif ($inSection) { $notes += $line }
          }
          if ($notes.Count -gt 0) {
            $notes -join "`n" | Set-Content dist/release-notes.md -Encoding utf8
            gh release create $env:RELEASE_TAG @paths --repo $env:GITHUB_REPOSITORY --title "RuxCmd $($env:RELEASE_TAG)" --notes-file dist/release-notes.md @extra
          } else {
            gh release create $env:RELEASE_TAG @paths --repo $env:GITHUB_REPOSITORY --title "RuxCmd $($env:RELEASE_TAG)" --generate-notes @extra
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
