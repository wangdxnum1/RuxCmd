[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "ls"
version = "0.1.0"
edition = "2024"
description = "A Windows ls clone — list directory contents, Linux-style"
authors = ["Tim"]

# Library entry point shared by the `ls` and `vdir` binaries.
[lib]
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
colored = "2"

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
