[package]
license.workspace = true
repository.workspace = true
name = "ruxcmd-core"
version = "0.1.0"
edition = "2021"
description = "Shared helpers for RuxCmd commands (byte-safe lines, path normalization, CPU sampling)"

[dependencies]
# Re-exported (see lib.rs) so command crates can use back-reference-capable
# matching without resolving a second regex engine into the workspace.
fancy-regex = "0.20.0"
regex = "1"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security"] }
