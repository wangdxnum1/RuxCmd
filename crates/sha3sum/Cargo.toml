[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "sha3sum"
version = "0.1.0"
edition = "2024"
description = "A Windows sha3sum clone - compute SHA-3 checksums"
authors = ["Tim"]

[dependencies]
sha3 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
