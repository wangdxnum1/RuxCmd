[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "date"
version = "0.1.0"
edition = "2024"
description = "A Windows date clone — display or set date and time, Linux-style"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
windows = { workspace = true }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
