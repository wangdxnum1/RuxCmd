[package]
license.workspace = true
repository.workspace = true
name = "grep"
version = "0.1.0"
edition = "2024"
description = "A Windows grep clone — search for patterns in files, Linux-style"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
ruxcmd-core = { path = "../ruxcmd-core" }
[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
