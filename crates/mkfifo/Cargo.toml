[package]
name = "mkfifo"
version = "0.1.0"
edition = "2024"
description = "A Windows mkfifo clone — create named pipes, Linux-style"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
winapi = { version = "0.3", features = ["winbase", "handleapi", "errhandlingapi"] }
