[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "traceroute"
version = "0.1.0"
edition = "2024"
description = "Trace the route packets take to a host"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper"] }

[build-dependencies]
ruxcmd-build.workspace = true
