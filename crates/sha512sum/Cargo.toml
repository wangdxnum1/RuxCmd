[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "sha512sum"
version = "0.1.0"
edition = "2024"
description = "A Windows sha512sum clone — compute SHA512 hash of files"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
