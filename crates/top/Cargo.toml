[package]
license.workspace = true
repository.workspace = true
name = "top"
version = "0.1.0"
edition = "2024"
description = "A Windows top clone — real-time system monitor"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ruxcmd-core = { path = "../ruxcmd-core" }
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_Foundation"] }
chrono = "0.4"

[dev-dependencies]
assert_cmd.workspace = true
