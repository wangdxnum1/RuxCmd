[package]
build = "../../build/windows-version.rs"
description = "Display information about running processes"

repository.workspace = true
name = "ps-bin"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[[bin]]
name = "ps"
path = "src/main.rs"

[dependencies]
ps-sys = { path = "../ps-sys" }
clap = { workspace = true }
bitflags = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[build-dependencies]
ruxcmd-build.workspace = true
