[package]
build = "../../build/windows-version.rs"
description = "Run a command and report elapsed and CPU time"
license.workspace = true
repository.workspace = true
name = "time"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_System_Threading", "Win32_Foundation"] }

[dev-dependencies]
predicates.workspace = true
assert_cmd.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
