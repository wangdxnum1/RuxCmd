[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "sar"
version = "0.1.0"
edition = "2024"
description = "A Windows sar clone — system activity reporter"
authors = ["Tim"]

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
ruxcmd-core = { path = "../ruxcmd-core" }
windows-sys = { version = "0.61", features = ["Win32_System_SystemInformation"] }

[build-dependencies]
ruxcmd-build.workspace = true
