[package]
name = "sar"
version = "0.1.0"
edition = "2024"
description = "A Windows sar clone — system activity reporter"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_System_Performance", "Win32_System_SystemInformation"] }
