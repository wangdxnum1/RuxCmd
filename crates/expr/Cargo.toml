[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "expr"
version = "0.1.0"
edition = "2024"
description = "A Windows expr clone - evaluate expressions"
authors = ["Tim"]

[dependencies]
ruxcmd-core = { path = "../ruxcmd-core" }
clap = { version = "4", features = ["derive"] }
