[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "sed"
version = "0.1.0"
edition = "2024"
description = "A Windows sed clone — stream editor for filtering and transforming text"
authors = ["Tim"]

[dependencies]
ruxcmd-core = { path = "../ruxcmd-core" }
regex = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
