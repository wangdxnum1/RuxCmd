[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "strings"
version = "0.1.0"
edition = "2024"
description = "Print the sequences of printable characters in files — a Windows port of the Linux strings command."
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
assert_cmd.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
