[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "md5sum"
version = "0.1.0"
edition = "2024"
description = "Compute MD5 hash sums of files — a Windows port of the Linux md5sum command"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
md5 = "0.7"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
