[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "xargs"
version = "0.1.0"
edition = "2024"
description = "Build and execute command lines from standard input — a Windows port of the Linux xargs command."
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_IO"] }

[dev-dependencies]
assert_cmd.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
