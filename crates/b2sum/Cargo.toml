[package]
build = "../../build/windows-version.rs"
license.workspace = true
repository.workspace = true
name = "b2sum"
version = "0.1.0"
edition = "2024"
description = "A Windows b2sum clone - compute or check BLAKE2b checksums"
authors = ["Tim"]

[dependencies]
clap = { version = "4", features = ["derive"] }
blake2 = "0.10"
hex = "0.4"

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true

[build-dependencies]
ruxcmd-build.workspace = true
